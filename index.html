$('meter').onclick=()=>{let n=prompt('Time signature (e.g. 3/4, 4/4, 6/8)',audioPrefs.beats+'/'+audioPrefs.denominator);if(!n)return;let m=/^(\d{1,2})\/(2|4|8|16)$/.exec(n.trim());if(!m||+m[1]<1||+m[1]>16)return status('Use a meter such as 3/4, 4/4 or 6/8');audioPrefs.beats=+m[1];audioPrefs.denominator=+m[2];persistAudioPrefs();if(playing||recording)startClick(position)};
$('latency').onclick=()=>modal('Audio Setup — experimental',[['Recording offset (ms)',()=>{let v=Number(prompt('Measured recording correction in milliseconds. Positive shifts newly recorded clips earlier. Range -500 to 500.',audioPrefs.recordOffsetMs));if(Number.isFinite(v)&&Math.abs(v)<=500){audioPrefs.recordOffsetMs=v;persistAudioPrefs();status('Recording correction '+v+' ms (manual, not calibrated)')}}],['Monitoring offset (ms)',()=>{let v=Number(prompt('Monitoring latency estimate in ms (informational only)',audioPrefs.monitorOffsetMs));if(Number.isFinite(v)&&v>=0&&v<=1000){audioPrefs.monitorOffsetMs=v;persistAudioPrefs()}}],['Metronome level',()=>{let v=Number(prompt('Click volume 0–100%',Math.round(audioPrefs.clickGain*100)));if(Number.isFinite(v)&&v>=0&&v<=100){audioPrefs.clickGain=v/100;persistAudioPrefs()}}],['Reset audio settings',()=>{audioPrefs={bpm:120,beats:4,denominator:4,click:false,monitorOffsetMs:0,recordOffsetMs:0,clickGain:.22};persistAudioPrefs();stopClick()}]],'IMPORTANT: Browser recording timing is not sample-accurate. Manual recording correction is an experimental alignment aid, NOT automatic round-trip calibration. Native USB interface calibration, compensated overdubbing, count-in and direct monitoring remain future work.');
updateAudioLabels();
demo();tick();
</script></body></html>
